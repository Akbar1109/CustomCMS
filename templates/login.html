{% extends "base.html" %}

{% block title %}
College Dashboard Login
{% endblock %}

{% block content %}

<div class="card">

    <h1>Dashboard : College Dashboard Login (Custom CMS)</h1>

    <form method="POST" action="{{ url_for('login') }}">

        {% if message %}
            <p class="flash-error" role="alert">{{ message }}</p>
        {% endif %}

        <div class="field">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >
        </div>

        <div class="field">
            <label for="email">Gmail Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@gmail.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="btn-row">
            <button type="submit" class="btn-login">Login</button>
            <button type="reset" class="btn-reset">Reset</button>
        </div>

    </form>

</div>

{% endblock %}
